/* Konsep: halaman buku tulis kotak-kotak, tinta biru, spidol kuning, koreksi guru dengan pena merah. Nilai 0-100. */
:root{
  --paper:#F4F8FF; --grid:#CFDDF3; --card:#FFFFFF; --soft:#E8EFFC;
  --ink:#14233F; --muted:#556789; --line:#14233F; --shadow:#14233F;
  --blue:#2358E0; --blue-d:#173F9F; --on-blue:#FFFFFF;
  --yellow:#FFC83D; --green:#0F7A50; --red:#C42A3D;
  --ok-bg:#DDF4E8; --bad-bg:#FDE2E5;
  --wood:#F2C79B; --pink:#FF9DB0; --band:#B8C4DA;
  --f-disp:"Baloo 2","Trebuchet MS","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0E1630; --grid:#1B2850; --card:#172249; --soft:#22305F;
  --ink:#E9EEFF; --muted:#9CABD0; --line:#8EA2D6; --shadow:#050A1C;
  --blue:#7C9DFF; --blue-d:#4262C8; --on-blue:#0B1230;
  --yellow:#FFD560; --green:#4BD6A0; --red:#FF7A8A;
  --ok-bg:#12382D; --bad-bg:#43202A;
  --wood:#D9A877; --pink:#E8809A; --band:#7C8BB0; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0E1630; --grid:#1B2850; --card:#172249; --soft:#22305F;
  --ink:#E9EEFF; --muted:#9CABD0; --line:#8EA2D6; --shadow:#050A1C;
  --blue:#7C9DFF; --blue-d:#4262C8; --on-blue:#0B1230;
  --yellow:#FFD560; --green:#4BD6A0; --red:#FF7A8A;
  --ok-bg:#12382D; --bad-bg:#43202A;
  --wood:#D9A877; --pink:#E8809A; --band:#7C8BB0; color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px; background-position:-1px -1px;
  color:var(--ink); font:400 17px/1.45 var(--f-body);
  padding-inline:16px; -webkit-tap-highlight-color:transparent;
  overscroll-behavior:none; user-select:none; -webkit-user-select:none;
}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
h1,h2,h3,p{margin:0}
#app{max-width:520px;height:100%;margin-inline:auto;position:relative}
.screen{height:100%;overflow-y:auto;display:flex;flex-direction:column;gap:18px;padding-block:18px;scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}
.num{font-variant-numeric:tabular-nums}

/* tombol utama */
.btn{background:var(--blue);color:var(--on-blue);border:0;border-radius:16px;box-shadow:0 5px 0 var(--blue-d);
  font:700 22px/1 var(--f-disp);min-height:56px;padding:12px 22px;transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--blue-d)}

</main>

<script>
'use strict';
/* Generator soal Jago Hitung, kelas 1-6 */
const rnd = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
const pick = a => a[rnd(0, a.length - 1)];
const shuffle = a => { const r = a.slice(); for (let i = r.length - 1; i > 0; i--) { const j = rnd(0, i); [r[i], r[j]] = [r[j], r[i]]; } return r; };
const gcd = (a, b) => b ? gcd(b, a % b) : Math.abs(a);
const lcm = (a, b) => a / gcd(a, b) * b;
const dot = n => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
const num = n => n < 0 ? '−' + dot(-n) : dot(n);
const par = n => n < 0 ? '(' + num(n) + ')' : num(n);
const rp = n => 'Rp' + dot(n);
const pad2 = n => String(n).padStart(2, '0');
const hh = (h, m) => pad2(h) + '.' + pad2(m);
const F = (n, d) => '<span class="frac"><span class="n">' + n + '</span><span class="d">' + d + '</span></span>';
const decStr = h => { const w = Math.floor(h / 100), f = h % 100; if (!f) return String(w); if (f % 10 === 0) return w + ',' + (f / 10); return w + ',' + pad2(f); };
const NAMES = ['Adi', 'Budi', 'Citra', 'Dewi', 'Eka', 'Fajar', 'Gita', 'Hana', 'Indra', 'Joko', 'Kiki', 'Lina', 'Rafi', 'Sari', 'Putri', 'Bayu'];
const twoNames = () => { const a = pick(NAMES); let b = pick(NAMES); while (b === a) b = pick(NAMES); return [a, b]; };

/* Pilihan jawaban angka: selisih kecil seperti salah hitung */
function numOpts(ans, o) {
  o = o || {};
  const fmt = o.fmt || num, min = o.min === undefined ? 0 : o.min;
  const s = o.spread || Math.max(1, Math.round(Math.abs(ans) * 0.1));
  const pool = shuffle([ans + 1, ans - 1, ans + 2, ans - 2, ans + 10, ans - 10, ans + s, ans - s, ans + 2 * s, ans - 2 * s].concat(o.extra || [])
    .filter(x => x !== ans && x >= min && (o.max === undefined || x <= o.max) && Number.isFinite(x)));
  const out = [ans];
  for (const x of pool) { if (out.length >= 4) break; if (!out.includes(x)) out.push(x); }
  let k = 3; while (out.length < 4 && k < 60) { for (const x of [ans + k, ans - k]) if (out.length < 4 && x >= min && (o.max === undefined || x <= o.max) && !out.includes(x)) out.push(x); k++; }
  return { choices: shuffle(out).map(fmt), correct: fmt(ans) };
}
function numQ(q, ans, ex, o) {
  o = o || {};
  const f = o.fmt || (n => num(n) + (o.unit ? ' ' + o.unit : ''));
  const oo = numOpts(ans, { fmt: f, min: o.min, max: o.max, extra: o.extra, spread: o.spread });
  return { q, kind: 'num', ans, show: f(ans), ex: ex || '', choices: oo.choices, correct: oo.correct, unit: o.unit || '', prefix: o.prefix || '', neg: !!o.neg, decimal: !!o.decimal };
}
function chQ(q, correct, wrongs, ex) {
  const w = [];
  for (const x of wrongs) if (x !== correct && !w.includes(x)) w.push(x);
  return { q, kind: 'choice', choices: shuffle([correct].concat(w.slice(0, 3))), correct, show: correct, ex: ex || '' };
}
/* Pilihan pecahan: nilai tidak boleh sama dengan jawaban benar */
function fracQ(q, n, d, cands, ex) {
  const correct = F(n, d), seen = [correct], wrongs = [];
  const add = (a, b) => { if (a < 1 || b < 1) return; if (a * d === n * b) return; const s = F(a, b); if (!seen.includes(s)) { seen.push(s); wrongs.push(s); } };
  cands.forEach(c => add(c[0], c[1]));
  let k = 1; while (wrongs.length < 3 && k < 30) { add(n + k, d); add(n, d + k); k++; }
  return chQ(q, correct, wrongs, ex);
}

const G = {};

/* ---------------- Kelas 1 ---------------- */
G[1] = [
  { id: 'tambah', name: 'Penjumlahan', fn() { const s = rnd(2, 20), a = rnd(1, s - 1), b = s - a; return numQ(a + ' + ' + b + ' = ?', s, a + ' + ' + b + ' = ' + s); } },
  { id: 'kurang', name: 'Pengurangan', fn() { const a = rnd(3, 20), b = rnd(1, a - 1); return numQ(a + ' − ' + b + ' = ?', a - b, a + ' − ' + b + ' = ' + (a - b)); } },
  { id: 'titik', name: 'Menghitung titik', fn() { const n = rnd(3, 20); const o = numQ('Ada berapa titik?', n, n > 10 ? 'Satu kotak penuh berisi 10. Ditambah ' + (n - 10) + ' titik lagi, jadi ' + n + '.' : 'Hitung titiknya satu per satu: ada ' + n + '.'); o.vis = { type: 'dots', n }; return o; } },
  { id: 'hilang', name: 'Angka yang hilang', fn() {
    if (Math.random() < 0.5) { const a = rnd(1, 19), s = rnd(a + 1, 20); return numQ(a + ' + ? = ' + s, s - a, 'Cari berapa yang perlu ditambah: ' + s + ' − ' + a + ' = ' + (s - a) + '.'); }
    const step = pick([1, 2, 5, 10]); let st;
    if (step === 10) st = rnd(0, 6) * 10; else if (step === 5) st = rnd(0, 12) * 5; else if (step === 2) st = rnd(1, 40); else st = rnd(1, 90);
    const x = [0, 1, 2, 3].map(i => st + i * step);
    return numQ(x[0] + ', ' + x[1] + ', ?, ' + x[3], x[2], 'Bilangan bertambah ' + step + ' setiap kali. ' + x[1] + ' + ' + step + ' = ' + x[2] + '.');
  } },
  { id: 'banding', name: 'Lebih besar atau kecil', fn() {
    const a = rnd(10, 99); let b = Math.random() < 0.5 ? a + pick([-1, 1]) * rnd(1, 9) : rnd(10, 99);
    if (b === a || b < 10 || b > 99) b = a > 50 ? a - 7 : a + 7;
    const big = Math.random() < 0.5, ans = big ? Math.max(a, b) : Math.min(a, b), other = a + b - ans;
    return chQ('Mana bilangan yang lebih ' + (big ? 'besar' : 'kecil') + '?', String(ans), [String(other)], 'Bandingkan puluhannya dulu. ' + ans + ' lebih ' + (big ? 'besar' : 'kecil') + ' dari ' + other + '.');
  } },
  { id: 'urut', name: 'Sebelum dan sesudah', fn() {
    const n = rnd(2, 98), after = Math.random() < 0.5;
    return numQ('Bilangan ' + (after ? 'sesudah' : 'sebelum') + ' ' + n + ' adalah ...', after ? n + 1 : n - 1, after ? n + ' + 1 = ' + (n + 1) : n + ' − 1 = ' + (n - 1), { min: 0 });
  } },
  { id: 'puluhan', name: 'Puluhan', fn() {
    const a = rnd(1, 8) * 10, b = rnd(1, (100 - a) / 10) * 10;
    if (Math.random() < 0.5) return numQ(a + ' + ' + b + ' = ?', a + b, (a / 10) + ' puluhan + ' + (b / 10) + ' puluhan = ' + ((a + b) / 10) + ' puluhan = ' + (a + b), { spread: 10 });
    return numQ((a + b) + ' − ' + b + ' = ?', a, ((a + b) / 10) + ' puluhan − ' + (b / 10) + ' puluhan = ' + (a / 10) + ' puluhan = ' + a, { spread: 10 });
  } }
];

/* ---------------- Kelas 2 ---------------- */
G[2] = [
  { id: 'tambah', name: 'Penjumlahan sampai 100', fn() { const a = rnd(12, 88), b = rnd(11, 100 - a); return numQ(a + ' + ' + b + ' = ?', a + b, 'Jumlahkan satuan dulu, lalu puluhan: ' + a + ' + ' + b + ' = ' + (a + b) + '.', { extra: [a + b + 100, a + b - 100] }); } },
  { id: 'kurang', name: 'Pengurangan sampai 100', fn() { const a = rnd(21, 99), b = rnd(11, a - 1); return numQ(a + ' − ' + b + ' = ?', a - b, a + ' − ' + b + ' = ' + (a - b) + '.'); } },
  { id: 'kali', name: 'Perkalian dasar', fn() { const a = pick([2, 3, 5, 10]), b = rnd(1, 10); return numQ(a + ' × ' + b + ' = ?', a * b, a + ' × ' + b + ' = ' + a * b + '. Artinya ' + a + ' dijumlahkan ' + b + ' kali.'); } },
  { id: 'bagi', name: 'Pembagian dasar', fn() { const b = pick([2, 3, 5, 10]), q = rnd(1, 10); return numQ(b * q + ' ÷ ' + b + ' = ?', q, b * q + ' ÷ ' + b + ' = ' + q + ', karena ' + b + ' × ' + q + ' = ' + b * q + '.'); } },
  { id: 'tempat', name: 'Nilai tempat', fn() {
    const d = shuffle([1, 2, 3, 4, 5, 6, 7, 8, 9]).slice(0, 3), n = d[0] * 100 + d[1] * 10 + d[2];
    const p = rnd(0, 2), dg = d[2 - p], val = dg * Math.pow(10, p);
    const names = ['satuan', 'puluhan', 'ratusan'];
    return chQ('Pada bilangan ' + n + ', angka ' + dg + ' bernilai ...', String(val), [dg, dg * 10, dg * 100, dg * 1000].map(String), 'Angka ' + dg + ' ada di tempat ' + names[p] + ', jadi nilainya ' + val + '.');
  } },
  { id: 'uang', name: 'Uang rupiah', fn() {
    const total = pick([2000, 3000, 4000, 5000, 10000]), item = 500 * rnd(1, total / 500 - 1), nm = pick(NAMES), t = pick(['permen', 'kue', 'pensil', 'penghapus']);
    return numQ(nm + ' punya ' + rp(total) + '. ' + nm + ' membeli ' + t + ' seharga ' + rp(item) + '. Sisa uang ' + nm + ' ...', total - item, rp(total) + ' − ' + rp(item) + ' = ' + rp(total - item) + '.', { fmt: rp, spread: 500, extra: [total + item] });
  } },
  { id: 'ganjil', name: 'Ganjil dan genap', fn() {
    const even = Math.random() < 0.5; const pool = []; while (pool.length < 4) { const x = rnd(10, 99); if (!pool.includes(x)) pool.push(x); }
    const want = pool.filter(x => (x % 2 === 0) === even), rest = pool.filter(x => (x % 2 === 0) !== even);
    if (want.length !== 1) { const w = rnd(5, 49) * 2 + (even ? 0 : 1); const r = []; while (r.length < 3) { const x = rnd(10, 99); if ((x % 2 === 0) !== even && !r.includes(x) && x !== w) r.push(x); } return chQ('Mana bilangan ' + (even ? 'genap' : 'ganjil') + '?', String(w), r.map(String), 'Bilangan genap berakhir 0, 2, 4, 6, 8. Bilangan ganjil berakhir 1, 3, 5, 7, 9.'); }
    return chQ('Mana bilangan ' + (even ? 'genap' : 'ganjil') + '?', String(want[0]), rest.map(String), 'Bilangan genap berakhir 0, 2, 4, 6, 8. Bilangan ganjil berakhir 1, 3, 5, 7, 9.');
  } }
];

/* ---------------- Kelas 3 ---------------- */
G[3] = [
  { id: 'kali', name: 'Perkalian', fn() { const a = rnd(2, 10), b = rnd(2, 10); return numQ(a + ' × ' + b + ' = ?', a * b, a + ' × ' + b + ' = ' + a * b + '.', { spread: pick([a, b]) }); } },
  { id: 'bagi', name: 'Pembagian', fn() { const b = rnd(2, 10), q = rnd(2, 10); return numQ(b * q + ' ÷ ' + b + ' = ?', q, b * q + ' ÷ ' + b + ' = ' + q + ', karena ' + b + ' × ' + q + ' = ' + b * q + '.'); } },
  { id: 'tk', name: 'Tambah kurang sampai 1.000', fn() {
    if (Math.random() < 0.5) { const a = rnd(120, 850), b = rnd(105, 999 - a); return numQ(num(a) + ' + ' + num(b) + ' = ?', a + b, 'Jumlahkan dari satuan, lalu puluhan, lalu ratusan: ' + num(a + b) + '.', { extra: [a + b + 100, a + b - 100] }); }
    const a = rnd(300, 999), b = rnd(105, a - 50); return numQ(num(a) + ' − ' + num(b) + ' = ?', a - b, 'Kurangi dari satuan, lalu puluhan, lalu ratusan: ' + num(a - b) + '.', { extra: [a - b + 100, a - b - 100] });
  } },
  { id: 'cerita', name: 'Soal cerita', fn() {
    const it = pick([['jeruk', 'keranjang'], ['pensil', 'kotak'], ['kelereng', 'kantong'], ['mangga', 'piring'], ['buku', 'rak'], ['permen', 'toples']]);
    const a = rnd(3, 9), b = rnd(3, 9);
    if (Math.random() < 0.5) return numQ('Ada ' + a + ' ' + it[1] + '. Setiap ' + it[1] + ' berisi ' + b + ' ' + it[0] + '. Berapa ' + it[0] + ' seluruhnya?', a * b, a + ' × ' + b + ' = ' + a * b + ' ' + it[0] + '.');
    return numQ('Ada ' + a * b + ' ' + it[0] + ' dibagi sama banyak ke ' + a + ' ' + it[1] + '. Setiap ' + it[1] + ' berisi ... ' + it[0] + '.', b, a * b + ' ÷ ' + a + ' = ' + b + '.');
  } },
  { id: 'keliling', name: 'Keliling', fn() {
    if (Math.random() < 0.5) { const s = rnd(3, 15); return numQ('Sebuah persegi bersisi ' + s + ' cm. Berapa keliling persegi itu?', 4 * s, 'Keliling persegi = 4 × sisi = 4 × ' + s + ' = ' + 4 * s + ' cm.', { unit: 'cm' }); }
    const p = rnd(5, 20), l = rnd(2, p - 1); return numQ('Persegi panjang berukuran panjang ' + p + ' cm dan lebar ' + l + ' cm. Berapa kelilingnya?', 2 * (p + l), 'Keliling = 2 × (' + p + ' + ' + l + ') = ' + 2 * (p + l) + ' cm.', { unit: 'cm' });
  } },
  { id: 'pecahan', name: 'Membandingkan pecahan', fn() {
    const n = rnd(2, 10); let m = rnd(2, 10); while (m === n) m = rnd(2, 10);
    const big = Math.random() < 0.5, ans = big ? Math.min(n, m) : Math.max(n, m), other = n + m - ans;
    return chQ('Mana pecahan yang lebih ' + (big ? 'besar' : 'kecil') + '?', F(1, ans), [F(1, other)], 'Makin besar penyebutnya, makin kecil potongannya. ' + F(1, Math.min(n, m)) + ' lebih besar dari ' + F(1, Math.max(n, m)) + '.');
  } },
  { id: 'waktu', name: 'Lama waktu', fn() {
    const sh = rnd(6, 11), sm = pick([0, 15, 30, 45]), dur = pick([30, 45, 60, 75, 90, 120]);
    const tot = sh * 60 + sm + dur, eh = Math.floor(tot / 60), em = tot % 60;
    return numQ('Pelajaran dimulai pukul ' + hh(sh, sm) + ' dan selesai pukul ' + hh(eh, em) + '. Berapa menit lamanya?', dur, 'Dari ' + hh(sh, sm) + ' sampai ' + hh(eh, em) + ' ada ' + dur + ' menit.', { unit: 'menit', spread: 15, extra: [dur + 15, dur - 15] });
  } }
];

/* ---------------- Kelas 4 ---------------- */
G[4] = [
  { id: 'kali', name: 'Perkalian bersusun', fn() {
    if (Math.random() < 0.5) { const a = rnd(12, 99), b = rnd(2, 9); return numQ(a + ' × ' + b + ' = ?', a * b, a + ' × ' + b + ' = (' + Math.floor(a / 10) * 10 + ' × ' + b + ') + (' + a % 10 + ' × ' + b + ') = ' + Math.floor(a / 10) * 10 * b + ' + ' + (a % 10) * b + ' = ' + num(a * b) + '.'); }
    const a = rnd(11, 30), b = rnd(11, 25); return numQ(a + ' × ' + b + ' = ?', a * b, a + ' × ' + b + ' = (' + a + ' × ' + Math.floor(b / 10) * 10 + ') + (' + a + ' × ' + b % 10 + ') = ' + a * Math.floor(b / 10) * 10 + ' + ' + a * (b % 10) + ' = ' + num(a * b) + '.');
  } },
  { id: 'bagi', name: 'Pembagian bersusun', fn() { const b = rnd(3, 12), q = rnd(12, 99); return numQ(num(b * q) + ' ÷ ' + b + ' = ?', q, num(b * q) + ' ÷ ' + b + ' = ' + q + ', karena ' + b + ' × ' + q + ' = ' + num(b * q) + '.'); } },
  { id: 'tk', name: 'Tambah kurang ribuan', fn() {
    if (Math.random() < 0.5) { const a = rnd(1000, 8000), b = rnd(1000, 9999 - a); return numQ(num(a) + ' + ' + num(b) + ' = ?', a + b, num(a) + ' + ' + num(b) + ' = ' + num(a + b) + '.'); }
    const a = rnd(2500, 9999), b = rnd(1000, a - 100); return numQ(num(a) + ' − ' + num(b) + ' = ?', a - b, num(a) + ' − ' + num(b) + ' = ' + num(a - b) + '.');
  } },
  { id: 'senilai', name: 'Pecahan senilai', fn() {
    const b = rnd(2, 6), a = rnd(1, b - 1), k = rnd(2, 5);
    return numQ(F(a, b) + ' = ' + F('?', b * k), a * k, 'Penyebut dikali ' + k + ' (' + b + ' × ' + k + ' = ' + b * k + '), maka pembilang juga dikali ' + k + ': ' + a + ' × ' + k + ' = ' + a * k + '.');
  } },
  { id: 'tpecahan', name: 'Pecahan, penyebut sama', fn() {
    const d = rnd(4, 12);
    if (Math.random() < 0.5) { const a = rnd(1, d - 2), b = rnd(1, d - 1 - a); return fracQ(F(a, d) + ' + ' + F(b, d) + ' = ?', a + b, d, [[a + b, 2 * d], [a + b + 1, d], [a + b - 1, d], [a * b, d]], 'Penyebut sama, jadi jumlahkan pembilangnya saja: ' + a + ' + ' + b + ' = ' + (a + b) + '.'); }
    const a = rnd(3, d - 1), b = rnd(1, a - 1); return fracQ(F(a, d) + ' − ' + F(b, d) + ' = ?', a - b, d, [[a - b, 2 * d], [a - b + 1, d], [a - b - 1, d], [a + b, d]], 'Penyebut sama, jadi kurangkan pembilangnya saja: ' + a + ' − ' + b + ' = ' + (a - b) + '.');
  } },
  { id: 'luas', name: 'Luas dan keliling', fn() {
    const t = rnd(0, 3);
    if (t === 0) { const p = rnd(6, 30), l = rnd(3, p - 1); return numQ('Persegi panjang berukuran ' + p + ' cm × ' + l + ' cm. Berapa luasnya?', p * l, 'Luas = panjang × lebar = ' + p + ' × ' + l + ' = ' + p * l + ' cm².', { unit: 'cm²' }); }
    if (t === 1) { const s = rnd(4, 25); return numQ('Sebuah persegi bersisi ' + s + ' cm. Berapa luasnya?', s * s, 'Luas = sisi × sisi = ' + s + ' × ' + s + ' = ' + s * s + ' cm².', { unit: 'cm²' }); }

  1: 'Tambah, kurang, hitung titik',
  2: 'Sampai 100, kali, uang',
  3: 'Kali, bagi, keliling, waktu',
  4: 'Pecahan, luas, FPB dan KPK',
  5: 'Desimal, persen, volume',
  6: 'Bilangan bulat, skala, tabung'
};

function buildRound(grade, topicId, n) {
  n = n || 10;
  const camb = (typeof GC !== 'undefined' && GC[grade]) || [];
  let gens = G[grade];
  if (topicId === '__c') gens = camb;
  else if (topicId) gens = G[grade].concat(camb).filter(g => g.id === topicId);
  const out = [], seen = new Set(); let bag = [];
  let guard = 0;
  while (out.length < n && guard++ < 600) {
    if (!bag.length) bag = shuffle(gens);
    const g = bag.pop(), q = g.fn();
    if (!q) continue;
    const key = q.q + JSON.stringify(q.vis || '') + (q.kind === 'choice' ? JSON.stringify(q.choices) : '');
    if (seen.has(key)) continue;
    seen.add(key); q.topic = g.name; q.method = g.method || ''; q.cam = camb.includes(g); out.push(q);
  }
  return out;
}

/* Ubah teks soal/penjelasan jadi kalimat yang enak dibaca suara */
function toSpeech(h) {
  let t = h.replace(/<span class="frac"><span class="n">(.*?)<\/span><span class="d">(.*?)<\/span><\/span>/g, ' $1 per $2 ');
  t = t.replace(/<[^>]+>/g, ' ');
  t = t.replace(/(\d)\.(?=\d{3}(\D|$))/g, '$1');
  t = t.replace(/(\d),(\d)/g, '$1 koma $2');
  t = t.replace(/Rp\s?(\d+)/g, '$1 rupiah');
  t = t.replace(/ − /g, ' kurang ').replace(/−/g, ' negatif ');
  t = t.replace(/ \+ /g, ' tambah ').replace(/\s?×\s?/g, ' kali ').replace(/\s?÷\s?/g, ' bagi ');
  t = t.replace(/\s?=\s?/g, ' sama dengan ');
  t = t.replace(/(\d+)\s*:\s*(\d+)/g, '$1 banding $2');
  t = t.replace(/cm²/g, 'sentimeter persegi').replace(/cm³/g, 'sentimeter kubik').replace(/\bkm\/jam\b/g, 'kilometer per jam').replace(/\bcm\b/g, 'sentimeter').replace(/\bkm\b/g, 'kilometer');
  t = t.replace(/√(\d+)/g, 'akar $1').replace(/(\d+)²/g, '$1 kuadrat').replace(/(\d+)³/g, '$1 pangkat tiga');
  t = t.replace(/π/g, 'pi').replace(/(\d+)\s?%/g, '$1 persen');
  t = t.replace(/\.\.\./g, ' titik titik').replace(/\?/g, ' berapa');
  return t.replace(/[()]/g, ' ').replace(/\s+/g, ' ').trim();
}

  function renderQ() {
    const q = cur(); S.locked = false; S.ent = '';
    $('#qhead').textContent = gname(S.grade) + ' · ' + q.topic;
    $('#qno').textContent = 'Soal ' + (S.i + 1) + ' dari ' + S.n;
    const qt = $('#qtext'); qt.innerHTML = q.q; qt.className = 'qtext' + (plain(q.q).length > 48 ? ' long' : '');
    $('#vis').innerHTML = visHTML(q.vis);
    const pill = $('#qpill'); pill.hidden = !q.cam; pill.textContent = q.cam ? q.method : '';
    const hn = $('#qhint'); hn.hidden = !q.hint; hn.textContent = q.hint || '';
    $('#qsay').hidden = !canSpeak || (q.lang === 'en' ? !q.listen : S.grade > 2);
    document.querySelectorAll('.seg').forEach((s, k) => { s.classList.toggle('cur', k === S.i); });
    $('#sheet').hidden = true; hush();
    face('think');
    if (q.kind === 'choice' || S.grade <= 3) {
      $('#answer').innerHTML = '<div class="choices ' + (q.ch || '') + '">' + q.choices.map((c, i) => '<button class="ch" data-i="' + i + '"><span class="k">' + (i + 1) + '</span><span>' + c + '</span></button>').join('') + '</div>';
    } else {
      const alt = q.neg ? '−' : (q.decimal ? ',' : '');
      $('#answer').innerHTML = '<div class="entry" id="entry">' + (q.prefix ? '<span class="pre">' + q.prefix + '</span>' : '') + '<output id="ev" class="ev"></output>' + (q.unit ? '<span class="unit">' + q.unit + '</span>' : '') + '</div>' +
        '<div class="pad">' + [7, 8, 9, 4, 5, 6, 1, 2, 3].map(d => '<button class="pk" data-k="' + d + '">' + d + '</button>').join('') +
        (alt ? '<button class="pk alt" data-k="' + alt + '" aria-label="' + (q.neg ? 'minus' : 'koma') + '">' + alt + '</button>' : '<span></span>') +
        '<button class="pk" data-k="0">0</button><button class="pk alt" data-k="back" aria-label="Hapus"><svg viewBox="0 0 24 24"><path d="M21 5H9l-6 7 6 7h12z"/><path d="M12 9.5l5 5M17 9.5l-5 5"/></svg></button></div>' +
        '<button id="chk" class="btn go" type="button">Periksa</button>';
    }
    if (q.listen && canSpeak) setTimeout(() => { if (!S.locked && cur() === q) say(q.say, 'en'); }, 400);
    else if (S.grade === 0 && vo && canSpeak) setTimeout(() => { if (!S.locked && cur() === q) say(toSpeech(q.say || plain(q.q))); }, 350);
  }
  $('#qsay').addEventListener('click', () => { const q = cur(); if (q && q.lang === 'en') say(q.say, 'en'); else if (q) say(toSpeech(q.say || plain(q.q))); });
  $('#answer').addEventListener('click', e => {
    const c = e.target.closest('.ch'), k = e.target.closest('.pk'), g = e.target.closest('#chk');
    if (c) pickChoice(+c.dataset.i); else if (k) key(k.dataset.k); else if (g) check();
  });
  function pickChoice(i) {
    if (S.locked) return; const q = cur(), v = q.choices[i]; if (v === undefined) return;
    resolve(v === q.correct, v, i);
  }
  function key(k) {
    if (S.locked) return;
    const M = '−', bare = S.ent.replace(M, '');
    if (k === 'back') S.ent = S.ent.slice(0, -1);
    else if (k === M) S.ent = S.ent.startsWith(M) ? S.ent.slice(1) : M + S.ent;
    else if (k === ',') { if (!S.ent.includes(',') && /\d$/.test(S.ent)) S.ent += ','; }
    else if (bare === '0') S.ent = (S.ent.startsWith(M) ? M : '') + k;
    else if (bare.replace(',', '').length < 9) S.ent += k;
    const ev = $('#ev'); if (ev) ev.textContent = S.ent;
  }
  function check() {
    if (S.locked) return;
    const t = S.ent.replace('−', '-').replace(',', '.'), v = parseFloat(t);
    if (isNaN(v)) { const en = $('#entry'); en.classList.remove('nudge'); void en.offsetWidth; en.classList.add('nudge'); return; }
    resolve(Math.abs(v - cur().ans) < 1e-9, S.ent);
  }
  const PRAISE = ['Betul!', 'Mantap!', 'Hebat!', 'Keren!', 'Tepat sekali!', 'Pintar!'];
  function resolve(ok, mine, idx) {
    S.locked = true; const q = cur();
    const seg = document.querySelectorAll('.seg')[S.i]; seg.classList.remove('cur'); seg.classList.add(ok ? 'ok' : 'bad');
    if (ok) { S.ok++; S.streak++; S.top = Math.max(S.top, S.streak); } else { S.streak = 0; S.wrong.push({ q: q.q, vis: q.vis, show: q.show }); }
    $('#cnt').textContent = '\u2713 ' + S.ok;
    sfx(ok ? 'ok' : 'bad'); face(ok ? 'happy' : 'sad');
    try { if (!ok && navigator.vibrate) navigator.vibrate(60); } catch (e) {}
    const chs = document.querySelectorAll('.ch');
    if (chs.length) chs.forEach((b, k) => { b.disabled = true; if (q.choices[k] === q.correct) b.classList.add('right'); else if (k === idx) b.classList.add('bad'); });
    else { const en = $('#entry'); en.classList.add(ok ? 'right' : 'bad'); document.querySelectorAll('.pad,#chk').forEach(b => { b.hidden = true; }); }
    const sh = $('#sheet'); sh.className = 'sheet ' + (ok ? 'ok' : 'bad'); sh.hidden = false;
    const pr = PRAISE[rnd(0, PRAISE.length - 1)];
    $('#sh').textContent = ok ? pr : (S.grade === 0 ? 'Hampir benar!' : 'Belum tepat');
    const en = q.lang === 'en';
    if (en) say(q.word, 'en');
    else if (ok && S.grade === 0 && vo) say(pr);
    $('#sp').innerHTML = ok ? (S.streak >= 3 ? 'Beruntun ' + S.streak + ' soal' : '') + '<span class="ex" id="sex" hidden>' + q.ex + '</span>' : 'Jawaban yang benar: <b>' + q.show + '</b><span class="ex" id="sex">' + q.ex + '</span>';
    $('#say').hidden = !canSpeak;
    if (!ok && vo && !en) say(toSpeech((S.grade === 0 ? 'Hampir benar. ' : 'Belum tepat. ') + 'Jawabannya ' + (q.ansSay || q.show) + '. ' + q.ex));
    $('#next').textContent = S.i === S.n - 1 ? 'Lihat nilai' : 'Lanjut';
    sh.scrollIntoView({ block: 'nearest' });
    if (ok) { const at = S.i; clearTimeout(S.timer); S.timer = setTimeout(() => { if (S.i === at && S.locked) next(); }, en ? 2200 : 1300); }
  }
  function next() {
    clearTimeout(S.timer); hush(); if (!S.locked) return;
    S.i++; if (S.i >= S.n) finish(); else renderQ();
  }
  $('#next').addEventListener('click', next);
  $('#say').addEventListener('click', () => {
    const q = cur(); clearTimeout(S.timer); const ex = $('#sex'); if (ex) ex.hidden = false;
    if (q.lang === 'en') { say(q.word, 'en'); return; }
    say(toSpeech('Soal. ' + (q.say || q.q) + '. ' + (q.desc ? q.desc + '. ' : '') + 'Jawabannya ' + (q.ansSay || q.show) + '. ' + q.ex));
  });

  /* ---- hasil ---- */
  function finish() {
    const nilai = Math.round(S.ok * 100 / S.n), st = starsOf(nilai), prev = best[S.grade];
    const rec = !!prev && nilai > prev.n;
    if (!prev || nilai > prev.n) best[S.grade] = { n: nilai, s: st };
    saveP();
    const msg = ['Ayo coba lagi', 'Bagus, terus berlatih', 'Hebat', 'Luar biasa'][st];
    $('#rmsg').textContent = msg + (name ? ', ' + name : '') + '!';
    $('#rnum').textContent = nilai;
    $('#rstars').innerHTML = starRow(st, 'big');
    $('#rstat').innerHTML = '<span class="chip num">Benar ' + S.ok + ' dari ' + S.n + '</span>' + (S.top >= 3 ? '<span class="chip num">Beruntun ' + S.top + '</span>' : '') + (rec ? '<span class="chip rec">Nilai terbaik!</span>' : '');
    const w = $('#rwrong'); w.hidden = !S.wrong.length;
    $('#rlist').innerHTML = S.wrong.map(x => '<li>' + visHTML(x.vis, true) + '<div class="wq' + (plain(x.q).length > 48 ? ' long' : '') + '">' + x.q + '</div><div class="wa">Jawaban: ' + x.show + '</div></li>').join('');
    sfx('done'); show('result');
    const svg = $('#result .nilai svg'); const p = svg.parentNode; p.replaceChild(svg.cloneNode(true), svg);
  }
  $('#again').addEventListener('click', () => start(S.grade, S.topic));
  $('#tohome').addEventListener('click', () => { buildHome(); show('home'); });

  /* ---- keluar ---- */
  $('#quit').addEventListener('click', () => { $('#confirm').hidden = false; $('#stay').focus(); });
  $('#stay').addEventListener('click', () => { $('#confirm').hidden = true; });
  $('#leave').addEventListener('click', () => { $('#confirm').hidden = true; clearTimeout(S.timer); hush(); S.locked = true; buildHome(); show('home'); });

  /* ---- papan ketik ---- */
  document.addEventListener('keydown', e => {
    if ($('#play').hidden || !$('#confirm').hidden || e.target.tagName === 'INPUT' || e.ctrlKey || e.metaKey) return;
    const k = e.key;
    if (S.locked) { if (k === 'Enter' || k === ' ') { e.preventDefault(); next(); } return; }
    if ($('.choices')) { if (/^[1-4]$/.test(k)) pickChoice(+k - 1); return; }
    if (/^\d$/.test(k)) key(k);
    else if (k === ',' || k === '.') key(',');
    else if (k === '-') key('−');
    else if (k === 'Backspace') key('back');
    else if (k === 'Enter') { e.preventDefault(); check(); }
  });

  buildHome(); show('home');
})();
</script>

<script>if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){window.addEventListener('load',function(){navigator.serviceWorker.register('./sw.js').catch(function(){});});}</script>
